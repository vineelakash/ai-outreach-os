name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach_user
          POSTGRES_PASSWORD: outreach_secret_pass
          POSTGRES_DB: ai_outreach_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://outreach_user:outreach_secret_pass@localhost:5432/ai_outreach_test_db?schema=public"

      - name: Run Vitest Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://outreach_user:outreach_secret_pass@localhost:5432/ai_outreach_test_db?schema=public"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_SECRET: "test-nextauth-secret-min-32-chars-long"
          AI_PROVIDER: "mock"

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://outreach_user:outreach_secret_pass@localhost:5432/ai_outreach_test_db?schema=public"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_SECRET: "test-nextauth-secret-min-32-chars-long"
          AI_PROVIDER: "mock"
