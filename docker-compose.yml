version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: outreach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach_user
      POSTGRES_PASSWORD: outreach_secret_pass
      POSTGRES_DB: ai_outreach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach_user -d ai_outreach_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: outreach_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Web Application & API
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: outreach_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://outreach_user:outreach_secret_pass@postgres:5432/ai_outreach_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-super-safe-32-chars-long-key-for-local-dev
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AI_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background Worker Process (BullMQ Jobs Engine)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: outreach_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://outreach_user:outreach_secret_pass@postgres:5432/ai_outreach_db?schema=public
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AI_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
